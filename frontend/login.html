<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — SOS Patitas</title>
<meta name="description" content="Acceso para moderadores y administradores.">
<meta name="theme-color" content="#0e5a52">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-raiz="" data-pagina="login">

<main id="contenido" class="contenedor">
  <div class="ingreso">
    <h1 style="font-size:var(--t-xl)">Ingresar al panel</h1>
    <p class="suave">Solo para moderadores y administradores. Para publicar o consultar un caso no necesitás cuenta.</p>
    <form id="form-login" class="form-caja" novalidate>
      <div data-resumen-errores></div>
      <div class="campo"><label for="email">Email</label><input class="entrada" id="email" name="email" type="email" autocomplete="username" inputmode="email"></div>
      <div class="campo"><label for="password">Contraseña</label><input class="entrada" id="password" name="password" type="password" autocomplete="current-password"></div>
      <div class="form-acciones"><button type="submit" class="btn btn--grande" style="width:100%">Ingresar</button></div>
    </form>
    <div class="aviso aviso--info" style="margin-top:var(--e-4)" id="ayuda-prueba">
      <p><strong>Datos de prueba:</strong><br>Moderador: moderador@sospatitas.test / moderador123<br>Administrador: admin@sospatitas.test / admin12345</p>
    </div>
  </div>
</main>
<noscript><div class="contenedor seccion"><div class="aviso aviso--alerta"><p>SOS Patitas necesita JavaScript para funcionar. Activalo en tu navegador y recargá la página.</p></div></div></noscript>
<script type="module" src="js/pages/login.js"></script>
</body>
</html>
